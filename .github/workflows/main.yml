# Nombre: Workflow de despliegue optimizado para Enova Hosting via SSH/rsync

name: Deploy Tecniempack CI/CD to Enova Hosting

on:
  push:
    branches:
      - main # Se dispara automáticamente al hacer push o commit en la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar llave SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ignore

      - name: Sincronizar archivos vía rsync hacia Enova
        run: |
          rsync -avz --delete \
            --exclude='.git*' \
            --exclude='.github*' \
            --exclude='.venv*' \
            --exclude='node_modules*' \
            --exclude='*.py' \
            -e "ssh -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/public_html/