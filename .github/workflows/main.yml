name: Deploy Tecniempack CI/CD to Enova Hosting

on:
  push:
    branches:
      - main  # Se dispara automáticamente al hacer push o commit en la rama main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar llave SSH
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        known_hosts: 'placeholder'

    - name: Añadir Host a Known Hosts
      run: ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Sincronizar archivos vía rsync hacia Enova
      run: |
        rsync -avz --delete \
          --exclude='.git*' \
          --exclude='.github*' \
          --exclude='.venv*' \
          --exclude='node_modules*' \
          --exclude='*.py' \
          -e "ssh -p ${{ secrets.SERVER_PORT }}" \
          ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/public_html/
